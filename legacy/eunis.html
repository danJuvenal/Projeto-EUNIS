<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EUNIS — Descreva, a gente ache!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EUNIS — tokens
   Branco e rosa claro. Tom leve, nada saturado.
   O rosa marca só o que é ação; o resto respira em branco.
   ============================================================ */
:root{
  --bg:#FFFFFF;
  --surface:#FFFAFB;
  --surface-2:#FBF0F3;
  --line:#F0E2E7;
  --text:#2E2429;
  --text-2:#8B7B82;
  --accent:#B4657E;
  --accent-soft:#FBEAF0;
  --accent-line:#EFD5DE;
  --onaccent:#FFFFFF;
  --alerta:#B4515B;
  --ok:#3E7F63;
  --shadow:0 12px 34px rgba(90,60,72,.10);
  --veu:.55;

  --r-s:14px; --r-m:18px; --r-l:28px;
  --sp:16px;
  --ff-display:'Fraunces',Georgia,'Times New Roman',serif;
  --ff-body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --maxw:480px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1518; --surface:#241C1F; --surface-2:#2F2429; --line:#3B2D33;
    --text:#F7EFF2; --text-2:#B4A2A9;
    --accent:#E9A9BC; --accent-soft:#38262D; --accent-line:#4A343C; --onaccent:#2A181E;
    --alerta:#E58A94; --ok:#78C9A5;
    --shadow:0 18px 44px rgba(0,0,0,.45); --veu:.3;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1518; --surface:#241C1F; --surface-2:#2F2429; --line:#3B2D33;
  --text:#F7EFF2; --text-2:#B4A2A9;
  --accent:#E9A9BC; --accent-soft:#38262D; --accent-line:#4A343C; --onaccent:#2A181E;
  --alerta:#E58A94; --ok:#78C9A5;
  --shadow:0 18px 44px rgba(0,0,0,.45); --veu:.3;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:var(--ff-body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- casca do app ---------- */
#sala{min-height:100%;display:flex;align-items:stretch;justify-content:center}
#app{
  width:100%;max-width:var(--maxw);background:var(--bg);position:relative;
  display:flex;flex-direction:column;min-height:100%;overflow:hidden;
}
@media (min-width:900px){
  #sala{background:
    radial-gradient(120% 70% at 50% -10%, color-mix(in srgb,var(--accent) 14%, transparent), transparent 60%),
    var(--bg);
    padding:28px 16px;}
  #app{border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);min-height:min(880px,calc(100vh - 56px));max-height:calc(100vh - 56px)}
}
#tela{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:96px}
.wrap{padding:0 20px}

/* ---------- tipografia ---------- */
h1,h2,h3{font-family:var(--ff-display);font-weight:600;margin:0;letter-spacing:-.015em;line-height:1.1}
h1{font-size:clamp(28px,8vw,36px)}
h2{font-size:23px}
h3{font-size:18px}
.sub{color:var(--text-2);font-size:14.5px;margin:6px 0 0}
.secao{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.secao h2{font-size:20px}
.secao button{color:var(--accent);font-size:13.5px;font-weight:600}

/* ---------- cabeçalho ---------- */
.topo{display:flex;align-items:center;gap:12px;padding:18px 20px 6px}
.topo .marca{font-family:var(--ff-display);font-weight:700;font-size:25px;letter-spacing:.14em;flex:1}
.topo .marca em{font-style:normal;color:var(--accent)}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:16px}
.voltar{display:inline-flex;align-items:center;gap:8px;color:var(--text-2);font-size:14px;font-weight:600;padding:16px 20px 4px}

/* ---------- busca por intenção ---------- */
.facho{
  margin:0 20px;padding:20px;border-radius:var(--r-l);position:relative;
  background:var(--accent-soft);border:1px solid var(--accent-line);
}
.facho h2{font-size:21px}
.facho p{margin:7px 0 14px;color:var(--text-2);font-size:14px;max-width:34ch}
.buscaia{display:flex;gap:8px;align-items:flex-end;background:var(--bg);border:1px solid var(--accent-line);border-radius:var(--r-m);padding:8px 8px 8px 14px}
.buscaia textarea{flex:1;border:none;background:none;resize:none;height:42px;font-size:15px;outline:none;padding:9px 0}
.buscaia textarea::placeholder{color:var(--text-2)}
.exemplo{margin-top:12px;font-size:13px;color:var(--text-2)}
.exemplo button{color:var(--accent);font-weight:600;text-align:left}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--text-2)}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:var(--r-m);font-weight:600;font-size:15px;width:100%;border:1px solid transparent}
.btn-1{background:var(--accent);color:var(--onaccent)}
.btn-2{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn-3{background:none;color:var(--text-2);font-weight:500}
.btn-sm{padding:9px 14px;font-size:13.5px;width:auto;border-radius:999px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- cartazes ---------- */
.cartaz{position:relative;aspect-ratio:2/3;border-radius:var(--r-s);overflow:hidden;display:grid;align-content:end;padding:10px;color:#fff;isolation:isolate;border:1px solid var(--line)}
.cartaz::before{content:"";position:absolute;inset:0;z-index:-2;
  background:linear-gradient(158deg,var(--c1),var(--c2));filter:saturate(.42) brightness(1.06)}
.cartaz::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,var(--veu)) 0%,rgba(255,255,255,0) 46%),
             linear-gradient(0deg,rgba(40,25,32,.78) 0%,rgba(40,25,32,0) 52%)}
.cartaz .tit{font-family:var(--ff-display);font-weight:600;font-size:14px;line-height:1.14}
.cartaz .meta{font-size:11px;opacity:.88;margin-top:3px}
.cartaz .sel{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.86);color:#3A2A31;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
.carrossel{display:grid;grid-auto-flow:column;grid-auto-columns:112px;gap:12px;overflow-x:auto;padding:2px 20px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.carrossel::-webkit-scrollbar{display:none}
.carrossel > *{scroll-snap-align:start}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grade.g2{grid-template-columns:repeat(2,1fr)}

/* ---------- carrossel grande do "Em alta" ---------- */
.palco{position:relative;margin-top:10px}
.trilho{display:grid;grid-auto-flow:column;grid-auto-columns:82%;gap:14px;overflow-x:auto;
  padding:4px 20px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.trilho::-webkit-scrollbar{display:none}
.destaque{scroll-snap-align:center;position:relative;border-radius:var(--r-l);overflow:hidden;
  aspect-ratio:3/4;display:grid;align-content:end;padding:20px;color:#fff;isolation:isolate;
  border:1px solid var(--line);box-shadow:var(--shadow);text-align:left}
.destaque::before{content:"";position:absolute;inset:0;z-index:-2;
  background:linear-gradient(162deg,var(--c1),var(--c2));filter:saturate(.45) brightness(1.04)}
.destaque::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,var(--veu)) 0%,rgba(255,255,255,0) 40%),
             linear-gradient(0deg,rgba(38,24,30,.86) 6%,rgba(38,24,30,.15) 58%,rgba(38,24,30,0) 100%)}
.destaque .posicao{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.9);color:#3A2A31;
  border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;font-family:var(--ff-display)}
.destaque h3{font-family:var(--ff-display);font-size:25px;line-height:1.06;margin-bottom:6px}
.destaque .linhameta{font-size:13px;opacity:.92}
.destaque .frase{font-size:13.5px;opacity:.92;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pontos{display:flex;gap:6px;justify-content:center;margin-top:12px}
.pontos i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.pontos i.on{width:20px;background:var(--accent)}

/* ---------- listas / cartões ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.card + .card{margin-top:12px}
.linha{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.linha .cartaz{width:56px;aspect-ratio:2/3;border-radius:6px;flex:none;padding:0}
.linha .cartaz .tit{display:none}
.linha .info{flex:1;min-width:0}
.linha .info strong{display:block;font-size:15px;font-weight:600}
.linha .info span{color:var(--text-2);font-size:13px}
.vazio{text-align:center;padding:40px 24px;color:var(--text-2)}
.vazio h3{color:var(--text);margin-bottom:8px}

/* ---------- formulários ---------- */
.campo{margin-bottom:14px}
.campo label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.campo input,.campo textarea,.campo select{
  width:100%;padding:14px;border-radius:var(--r-m);border:1px solid var(--line);
  background:var(--surface);outline:none;font-size:15px}
.campo input:focus,.campo textarea:focus{border-color:var(--accent)}
.campo .ajuda{font-size:12.5px;color:var(--text-2);margin-top:6px}
.erro{color:var(--alerta);font-size:13px;margin-top:6px;display:block}
.forca{height:4px;border-radius:2px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.forca i{display:block;height:100%;width:0;background:var(--alerta);transition:width .25s}

/* ---------- avaliação / estrelas ---------- */
.estrelas{display:inline-flex;gap:3px;font-size:18px;color:var(--accent);letter-spacing:1px}
.estrelas.input button{font-size:28px;color:var(--line)}
.estrelas.input button.on{color:var(--accent)}
.nota{font-family:var(--ff-display);font-weight:700;font-size:15px}

/* ---------- comentários ---------- */
.coment{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;font-family:var(--ff-display)}
.coment .corpo{flex:1;min-width:0}
.coment .quem{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.coment .quando{color:var(--text-2);font-weight:400;font-size:12px}
.coment p{margin:5px 0 8px;font-size:14.5px}
.selo{font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}

/* ---------- navegação inferior ---------- */
#nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--surface) 88%, transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
#nav button{display:grid;justify-items:center;gap:3px;font-size:10.5px;color:var(--text-2);padding:4px 0}
#nav button .ic{font-size:19px;line-height:1}
#nav button.on{color:var(--accent);font-weight:700}

/* ---------- folha (modal) ---------- */
.folha-fundo{position:fixed;inset:0;background:rgba(10,7,18,.6);display:grid;align-items:end;justify-items:center;z-index:50}
.folha{width:100%;max-width:var(--maxw);background:var(--bg);border-radius:var(--r-l) var(--r-l) 0 0;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow-y:auto;
  animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.folha .puxador{width:38px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 16px}

/* ---------- avisos ---------- */
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0 4px}
.tabs button{padding:11px 14px;font-size:14px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}

.pensando{display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:14px;padding:18px 0}
.pensando i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pisca 1s infinite}
.pensando i:nth-child(2){animation-delay:.15s}.pensando i:nth-child(3){animation-delay:.3s}
@keyframes pisca{0%,100%{opacity:.25}50%{opacity:1}}

.fita{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--text-2);background:var(--surface-2);
  border-radius:var(--r-s);padding:10px 12px;margin-top:14px}
hr{border:none;border-top:1px solid var(--line);margin:20px 0}

/* ---------- explorador de categorias ---------- */
.cat{border-bottom:1px solid var(--line)}
.cat > .cab{display:flex;align-items:center;gap:12px;width:100%;padding:16px 0;text-align:left}
.cat > .cab strong{flex:1;font-size:15.5px;font-weight:600}
.cat > .cab .conta{font-size:13px;color:var(--accent);font-weight:600}
.cat > .cab .seta{color:var(--text-2);transition:transform .2s;font-size:13px}
.cat.aberta > .cab .seta{transform:rotate(90deg)}
.cat .corpo{display:none;padding:0 0 16px}
.cat.aberta .corpo{display:block}
.malha{display:flex;flex-wrap:wrap;gap:8px}
.barra-res{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 26%);padding:14px 0 6px}
.busca-simples{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:12px 18px}
.busca-simples input{flex:1;border:none;background:none;outline:none;font-size:15px}
.segment{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;margin-top:12px}
.segment button{flex:1;padding:9px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--text-2)}
.segment button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 4px rgba(90,60,72,.12)}
.mini{font-size:12.5px;color:var(--text-2)}
.switch{position:relative;width:46px;height:27px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);flex:none;transition:background .2s}
.switch i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--text-2);transition:transform .2s,background .2s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on i{transform:translateX(19px);background:#fff}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.opt .t{flex:1}.opt .t strong{display:block;font-size:15px;font-weight:600}
.opt .t span{font-size:13px;color:var(--text-2)}
</style>
</head>
<body>
<div id="sala"><div id="app">
  <div id="tela" role="main"></div>
  <nav id="nav" hidden></nav>
</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="folha"></div>

<script>
"use strict";
/* ============================================================
   EUNIS — MVP navegável
   Camadas: Banco (persistência) → Auth → Regras → Telas
   ============================================================ */

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const el = (t,a={},...f)=>{const n=document.createElement(t);
  for(const k in a){ if(k==="class")n.className=a[k]; else if(k==="html")n.innerHTML=a[k];
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]); else if(a[k]!==null&&a[k]!==false)n.setAttribute(k,a[k]); }
  f.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c)));return n;};
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p+"_"+Math.random().toString(36).slice(2,10);
const agora = () => new Date().toISOString();
function desde(iso){
  const s=(Date.now()-new Date(iso))/1000;
  if(s<60)return "agora"; if(s<3600)return Math.floor(s/60)+" min";
  if(s<86400)return Math.floor(s/3600)+" h"; if(s<2592000)return Math.floor(s/86400)+" d";
  return new Date(iso).toLocaleDateString("pt-BR");
}
let toastT;
function avisar(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2600);}

/* ---------- filtro de palavrões (RN: opcional, por usuário) ---------- */
const PALAVROES=["merda","porra","caralho","buceta","foda","fodase","puta","putaquepariu","cuzao","babaca","viado","arrombado","desgraca","desgraça","bosta","crl","pqp","vtnc","otario","otário","imbecil","idiota","escroto"];
function limparTexto(txt, ativo){
  if(!ativo) return txt;
  return txt.replace(/[\wÀ-ÿ]+/g, p => {
    const n = p.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    return PALAVROES.some(x=>n===x.normalize("NFD").replace(/[\u0300-\u036f]/g,"")) ? p[0]+"•".repeat(Math.max(p.length-1,2)) : p;
  });
}

/* ============================================================
   1. BANCO DE DADOS  (modelagem do §15 do PRD)
   ============================================================ */
const Banco = {
  CHAVE:"eunis.db.v1",
  d:null,
  iniciar(){
    try{ const cru = localStorage.getItem(this.CHAVE); if(cru) this.d = JSON.parse(cru); }
    catch(e){ this.d=null; }
    if(!this.d || this.d.versao!==1){ this.d = this.semente(); this.salvar(); }
    // tabelas que podem faltar em bancos antigos
    ["usuarios","avaliacoes","comentarios","listas","itensLista","eventos"].forEach(t=>this.d[t]=this.d[t]||[]);
  },
  salvar(){ try{ localStorage.setItem(this.CHAVE, JSON.stringify(this.d)); }catch(e){ avisar("Não consegui salvar neste navegador."); } },
  zerar(){ try{ localStorage.removeItem(this.CHAVE); }catch(e){} this.d=null; this.iniciar(); },

  // consultas
  usuarioPorEmail(email){ return this.d.usuarios.find(u=>u.email===email.trim().toLowerCase()); },
  usuario(id){ return this.d.usuarios.find(u=>u.id===id); },
  conteudo(id){ return this.d.catalogo.find(c=>c.id===id); },
  avaliacoesDe(cid){ return this.d.avaliacoes.filter(a=>a.conteudoId===cid); },
  minhaAvaliacao(uid,cid){ return this.d.avaliacoes.find(a=>a.conteudoId===cid&&a.usuarioId===uid); },
  comentariosDe(cid){ return this.d.comentarios.filter(c=>c.conteudoId===cid).sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm)); },
  listasDe(uid){ return this.d.listas.filter(l=>l.usuarioId===uid).sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm)); },
  listasPublicas(){ return this.d.listas.filter(l=>l.publica).sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm)); },
  itensDe(listaId){ return this.d.itensLista.filter(i=>i.listaId===listaId); },
  notaMedia(cid){
    const a=this.avaliacoesDe(cid); if(!a.length) return null;

async function hash(txt){
  try{
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("eunis$"+txt));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){ let h=5381; for(const c of "eunis$"+txt) h=((h<<5)+h+c.charCodeAt(0))>>>0; return "f"+h.toString(16); }
}

  return p; // 0..4
}

function buscarLocal(texto){ // reserva: roda quando a IA não está disponível
  const q=normal(texto);
  const toks=q.split(/[^a-z0-9]+/).filter(t=>t.length>2 && !PARADAS.has(t));
  const temasAlvo=new Set(), generosAlvo=new Set();
  for(const [chave,ts] of Object.entries(SINONIMOS)) if(q.includes(chave)) ts.forEach(t=>temasAlvo.add(t));
  for(const [chave,g] of Object.entries(SIN_GENERO)) if(q.includes(chave)) generosAlvo.add(g);
  const soSerie=/\bseries?\b|seriado|temporada|maratonar/.test(q);
  const soFilme=/\bfilmes?\b|longa/.test(q);
  const curto=/curto|rapido|ate 1h|1h[0-5]/.test(q);

  const pontuados=Banco.d.catalogo.map(c=>{
    let s=0;
    c.temas.forEach(t=>{ if(temasAlvo.has(t)) s+=5; });
    c.generos.forEach(g=>{ if(generosAlvo.has(g)) s+=3; });
    const tit=normal(c.titulo), sin=normal(c.sinopse), dir=normal(c.direcao);
    toks.forEach(t=>{
      if(tit.includes(t)) s+=5;
      else if(dir.includes(t)) s+=4;
      else if(c.temas.some(x=>normal(x).includes(t))) s+=4;
      else if(c.generos.some(g=>normal(g).includes(t))) s+=3;
      else if(new RegExp("\\b"+t).test(sin)) s+=2;
    });
    if(/\bbrasil|brasileiro|nacional\b/.test(q) && ["c02","c03","c18","c19","c20","c21","c22","c23","c24","c25","c32"].includes(c.id)) s+=5;
    if(curto && c.tipo==="filme" && /^1h/.test(c.duracao)) s+=2;
    return {c,s};
  }).filter(o=>o.s>=3 && !(soSerie&&o.c.tipo!=="serie") && !(soFilme&&o.c.tipo!=="filme"));

  pontuados.sort((a,b)=>b.s-a.s||nota(b.c)-nota(a.c));
  if(!pontuados.length){ // nada bateu: devolve os mais bem avaliados do tipo pedido
    return Banco.d.catalogo
      .filter(c=>!(soSerie&&c.tipo!=="serie") && !(soFilme&&c.tipo!=="filme"))
      .sort((a,b)=>nota(b)-nota(a)).slice(0,5).map(c=>c.id);
  }
  return pontuados.slice(0,6).map(o=>o.c.id);
}

{"ids":["c05"],"explicacao":"uma frase curta em português explicando o critério que você usou","interpretacao":["até 4 palavras-chave do pedido"]}`}],
      {modelTier:"quick", cache:true});
    const ids=(r?.ids||[]).filter(id=>Banco.conteudo(id));
    if(!ids.length) return {ids:buscarLocal(texto), explicacao:r?.explicacao||null, fonte:"ia"};
    return {ids, explicacao:r?.explicacao||null, interpretacao:r?.interpretacao||[], fonte:"ia"};
  }catch(e){

function buscarPorFiltros(fl){ // RF05
  Banco.registrar("busca_filtros",fl);
  return Banco.d.catalogo.filter(c=>{
    if(fl.tipo&&fl.tipo!=="todos"&&c.tipo!==fl.tipo) return false;
    if(fl.generos?.length && !fl.generos.some(g=>c.generos.includes(g))) return false;
    if(fl.temas?.length && !fl.temas.some(t=>c.temas.includes(t))) return false;
    if(fl.plataformas?.length && !fl.plataformas.some(p=>c.plataformas.includes(p))) return false;
    if(fl.notaMin && nota(c)<fl.notaMin) return false;
    if(fl.anoMin && c.ano<fl.anoMin) return false;
    if(fl.texto && !normal(c.titulo+" "+c.sinopse+" "+c.direcao).includes(normal(fl.texto))) return false;
    if(fl.curto && !(c.tipo==="filme" && /^1h/.test(c.duracao))) return false;
    if(fl.brasil && !BRASILEIROS.includes(c.id)) return false;
    return true;
  }).sort((a,b)=>nota(b)-nota(a));
}

let rota={nome:"abertura",p:{}};
let pilha=[];
const RAIZ=["inicio","buscar","listas","perfil","abertura"];
function ir(nome,p={},limpar){
  if(limpar||RAIZ.includes(nome)) pilha=[];
  else { pilha.push(rota); if(pilha.length>20) pilha.shift(); }
  rota={nome,p}; $("#tela").scrollTop=0; render();
}
function voltarRota(){
  const r=pilha.pop();
  if(r){ rota=r; $("#tela").scrollTop=0; render(); } else ir("inicio",{},true);
}

const TELAS={};
function render(){
  const t=$("#tela"); t.innerHTML="";
  const publica=["abertura","cadastro","login","recuperar","onboarding"].includes(rota.nome);
  if(!publica && !Sessao.uid){ rota={nome:"abertura",p:{}}; }
  (TELAS[rota.nome]||TELAS.inicio)(t,rota.p);
  montarNav(publica);
}
function montarNav(esconder){
  const n=$("#nav");
  if(esconder||!Sessao.uid){ n.hidden=true; return; }
  n.hidden=false; n.innerHTML="";
  [["inicio","◱","Início"],["buscar","◎","Buscar"],["listas","☰","Listas"],["perfil","◔","Perfil"]]
    .forEach(([r,ic,rot])=>{
      n.append(el("button",{class:rota.nome===r?"on":"",onclick:()=>ir(r)},
        el("span",{class:"ic"},ic), el("span",{},rot)));
    });
}

    el("h1",{},"Criar conta"),
    el("p",{class:"sub",style:"margin-bottom:22px"},"Leva menos tempo do que escolher um filme sozinho."),
    campo("n","Como te chamamos","text","Seu nome"),
    campo("e","E-mail","email","voce@email.com"),
    (()=>{const c=campo("s","Senha","password","Pelo menos 8 caracteres","Use letras, números e um símbolo para ficar forte.");

        const p=forcaSenha(ev.target.value);

        i.style.background=p<=1?"var(--alerta)":p===2?"var(--accent)":"var(--ok)";});
      c.insertBefore(barra,c.querySelector(".ajuda")); return c;})(),
    campo("s2","Confirmar senha","password","Repita a senha"),
    el("label",{class:"opt",style:"border:none"},
      el("input",{type:"checkbox",id:"termos",style:"width:auto"}),
      el("span",{class:"mini",style:"flex:1"},"Li e aceito os termos de uso e a política de privacidade.")),
    erros,
    el("button",{class:"btn btn-1",style:"margin-top:8px",id:"enviar",onclick:enviar},"Criar conta"),
    el("button",{class:"btn btn-3",style:"margin-top:6px",onclick:()=>ir("login")},"Já tenho conta"));

  async function enviar(){
    erros.innerHTML="";
    const nome=$("#n").value.trim(), email=$("#e").value.trim(), s1=$("#s").value, s2=$("#s2").value;

    if(nome.length<2)e.push("Escreva seu nome.");

TELAS.inicio=t=>{
  const u=Sessao.user;
  Banco.registrar("abriu_home");
  const fav=u.generosFav;
  const alta=[...Banco.d.catalogo].sort((a,b)=>nota(b)-nota(a)).slice(0,7);
  const paraVoce=[...Banco.d.catalogo].filter(c=>fav.some(g=>c.generos.includes(g))&&!alta.slice(0,3).includes(c)).sort((a,b)=>nota(b)-nota(a));
  const brasil=Banco.d.catalogo.filter(c=>BRASILEIROS.includes(c.id));
  const series=Banco.d.catalogo.filter(c=>c.tipo==="serie").sort((a,b)=>nota(b)-nota(a));

  t.append(cabecalho(null, el("button",{class:"iconbtn","aria-label":"Configurações",onclick:()=>ir("config")},"⚙")));
  t.append(el("p",{class:"sub",style:"padding:0 20px 2px"},`Boa sessão, ${u.nome.split(" ")[0]}.`));

  // --- carrossel grande: Em alta da semana ---
  t.append(el("div",{class:"secao wrap",style:"margin:18px 0 0"},el("h2",{},"Em alta da semana")));
  const trilho=el("div",{class:"trilho"});
  alta.forEach((c,i)=>{
    trilho.append(el("button",{class:"destaque",style:`--c1:${c.c1};--c2:${c.c2}`,onclick:()=>ir("conteudo",{id:c.id})},
      el("span",{class:"posicao"},(i+1)+"º da semana"),
      el("h3",{},c.titulo),
      el("span",{class:"linhameta"},`${c.tipo==="filme"?"Filme":"Série"} · ${c.ano} · ${c.duracao} · ★ ${nota(c).toFixed(1)}`),
      el("span",{class:"frase"},c.sinopse)));
  });
  const pontos=el("div",{class:"pontos"},...alta.map((_,i)=>el("i",{class:i===0?"on":""})));
  trilho.addEventListener("scroll",()=>{
    const i=Math.round(trilho.scrollLeft/(trilho.scrollWidth/alta.length));
    [...pontos.children].forEach((d,k)=>d.classList.toggle("on",k===Math.min(i,alta.length-1)));
  },{passive:true});
  t.append(el("div",{class:"palco"},trilho,pontos));

  // --- busca por intenção, logo abaixo ---
  t.append(el("div",{style:"height:26px"}));
  caixaIA(t);

  const secao=(titulo,itens,verTudo)=>{
    if(!itens.length)return;
    t.append(el("div",{class:"secao wrap"}, el("h2",{},titulo), verTudo?el("button",{onclick:verTudo},"ver tudo"):null));
    const car=el("div",{class:"carrossel"}); itens.slice(0,12).forEach(c=>car.append(cartaz(c))); t.append(car);
  };
  if(paraVoce.length) secao("Porque você curte "+fav.slice(0,2).join(" e "),paraVoce,()=>ir("resultados",{filtros:{generos:fav},titulo:"Para você"}));

  // trilhas por categoria — as buscas mais comuns viram atalho
  TRILHAS.forEach(tr=>{
    const itens=buscarPorFiltros(tr.filtros);
    secao(tr.rot,itens,()=>ir("resultados",{filtros:tr.filtros,titulo:tr.rot}));
  });

  secao("Feito no Brasil",brasil,()=>ir("resultados",{filtros:{brasil:true},titulo:"Feito no Brasil"}));
  secao("Séries para maratonar",series,()=>ir("resultados",{filtros:{tipo:"serie"},titulo:"Séries para maratonar"}));

  const pub=Banco.listasPublicas().slice(0,3);
  if(pub.length){
    t.append(el("div",{class:"secao wrap"},el("h2",{},"Listas da comunidade"),el("button",{onclick:()=>ir("listas",{aba:"comunidade"})},"ver tudo")));
    const box=el("div",{class:"wrap"}); pub.forEach(l=>box.append(cardLista(l))); t.append(box);
  }
  t.append(el("div",{class:"wrap"},el("div",{class:"fita"},"Catálogo de demonstração. Em produção, títulos e disponibilidade vêm da API TMDb.")));
};

        if(!l.publica && !exigirPremium("Publicar listas")) return;
        l.publica=!l.publica; Banco.salvar(); avisar(l.publica?"Lista publicada":"Lista agora é privada"); render();
      }},l.publica?"Tornar privada":"Publicar lista"),
      el("button",{class:"btn btn-3 btn-sm",onclick:()=>{
        Banco.d.listas=Banco.d.listas.filter(x=>x.id!==l.id);
        Banco.d.itensLista=Banco.d.itensLista.filter(i=>i.listaId!==l.id);
        Banco.salvar(); avisar("Lista apagada"); ir("listas");
      }},"Apagar")):null));
  const box=el("div",{class:"wrap",style:"margin-top:16px"});
  if(!itens.length) box.append(el("div",{class:"vazio"},el("h3",{},"Lista vazia"),el("p",{},"Abra um título e use “Salvar em uma lista”.")));
  itens.forEach(({i,c})=>{
    box.append(el("div",{class:"card",style:"margin-bottom:10px;display:flex;gap:12px;align-items:center"},
      linhaConteudo(c),
      meu?el("button",{class:"mini",style:"flex:none",onclick:()=>{
        Banco.d.itensLista=Banco.d.itensLista.filter(x=>x.id!==i.id); Banco.salvar(); render(); avisar("Removido");
      }},"✕"):null));
  });
  t.append(box);
};

  const minhasL=Banco.listasDe(u.id);
  t.append(cabecalho("Perfil", el("button",{class:"iconbtn","aria-label":"Configurações",onclick:()=>ir("config")},"⚙")));
  t.append(el("div",{class:"wrap",style:"display:flex;gap:14px;align-items:center;margin-top:8px"},
    avatar(u,64),
    el("div",{style:"flex:1;min-width:0"},
      el("h2",{},u.nome),
      el("p",{class:"sub"},u.email),

  t.append(el("div",{class:"wrap",style:"margin-top:18px"},
    el("div",{style:"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center"},
      ...[[minhasAv.length,"avaliações"],[minhasL.length,"listas"],[meusCm.length,"comentários"]]
        .map(([n,r])=>el("div",{class:"card"},el("div",{class:"nota",style:"font-size:22px"},n),el("div",{class:"mini"},r))))));

  if(u.plano!=="premium") t.append(el("div",{class:"wrap"},
    el("div",{class:"card",style:"margin-top:16px;border-color:var(--accent)"},
      el("h3",{},"Assine o Premium"),
      el("p",{class:"mini",style:"margin:6px 0 12px"},"Avaliar, comentar, publicar listas e personalizar o perfil."),
      el("button",{class:"btn btn-1 btn-sm",onclick:()=>exigirPremium("Este recurso")},"Ver o que muda"))));

  if(minhasAv.length){
    t.append(el("div",{class:"secao wrap"},el("h2",{},"O que você avaliou")));
    const box=el("div",{class:"wrap"});
    minhasAv.slice().reverse().forEach(a=>{const c=Banco.conteudo(a.conteudoId); if(c)
      box.append(el("div",{class:"card",style:"margin-bottom:10px"},linhaConteudo(c,"sua nota: "+"★".repeat(a.nota))));});
    t.append(box);
  }
  if(minhasL.length){
    t.append(el("div",{class:"secao wrap"},el("h2",{},"Suas listas"),el("button",{onclick:()=>ir("listas")},"ver tudo")));
    const box=el("div",{class:"wrap"}); minhasL.slice(0,3).forEach(l=>box.append(cardLista(l))); t.append(box);
  }
  t.append(el("div",{class:"wrap"},
    el("button",{class:"btn btn-2",style:"margin-top:22px",onclick:()=>ir("metricas")},"Métricas do produto"),
    el("button",{class:"btn btn-3",style:"margin-top:8px",onclick:()=>{Sessao.fechar();ir("abertura");avisar("Você saiu.");}},"Sair da conta")));
};

      el("span",{class:"t"},el("strong",{},rot),el("span",{},desc)),sw);

      el("input",{id:"nome",value:u.nome,onchange:e=>{u.nome=e.target.value.trim()||u.nome;Banco.salvar();avisar("Nome atualizado");}})),

    el("div",{class:"secao"},el("h2",{},"Conteúdo")),

      el("span",{class:"t"},el("strong",{},"Gêneros favoritos"),el("span",{},u.generosFav.length?u.generosFav.join(", "):"Nenhum escolhido")),el("span",{},"›")),

    el("div",{class:"secao"},el("h2",{},"Aparência")),
    el("div",{style:"display:flex;gap:8px;margin-bottom:8px"},
      ...[["sistema","Sistema"],["light","Matinê"],["dark","Sessão noturna"]].map(([k,r])=>
        el("button",{class:"chip"+(cfg.tema===k?" on":""),onclick:e=>{
          cfg.tema=k;Banco.salvar();aplicarTema();
          [...e.currentTarget.parentNode.children].forEach(b=>b.classList.remove("on"));e.currentTarget.classList.add("on");}},r))),

    el("div",{class:"secao"},el("h2",{},"Plano")),

      el("strong",{},u.plano==="premium"?"Premium ativo":"Plano gratuito"),

        ? el("button",{class:"btn btn-2 btn-sm",onclick:()=>{u.plano="free";Banco.salvar();avisar("Voltou para o gratuito");render();}},"Voltar ao gratuito")
        : el("button",{class:"btn btn-1 btn-sm",onclick:()=>exigirPremium("Este recurso")},"Assinar Premium")),

    el("div",{class:"secao"},el("h2",{},"Dados")),

    el("button",{class:"btn btn-3",style:"margin-top:8px;color:var(--alerta)",onclick:()=>{

        el("button",{class:"btn btn-1",style:"margin-top:16px;background:var(--alerta);color:#fff",onclick:async()=>{
          Banco.zerar(); await semearComunidade(); Sessao.uid=null; $("#folha").innerHTML=""; ir("abertura"); avisar("Banco reiniciado");
        }},"Apagar e recomeçar"));
    }},"Apagar todos os dados"),
    el("p",{class:"mini",style:"margin-top:20px"},"EUNIS MVP 1.0 · protótipo navegável do PRD. Dados ficam apenas neste navegador.")));
};

async function baixar(blob,nome){
  try{
    const d = window.claude?.use ? await window.claude.use("downloads") : null;
    if(d){ await d.save({filename:nome,data:await blob.text()}); return; }
  }catch(e){}
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

TELAS.metricas=t=>{ // §19
  const ev=Banco.d.eventos; const conta=k=>ev.filter(e=>e.tipo===k).length;
  const linhas=[["Cadastros",conta("cadastro")],["Logins",conta("login")],["Buscas por IA",conta("busca_ia")],
    ["Buscas por filtros",conta("busca_filtros")],["Títulos abertos",conta("abriu_conteudo")],
    ["Avaliações",Banco.d.avaliacoes.length],["Comentários",Banco.d.comentarios.length],
    ["Listas criadas",Banco.d.listas.length],["Itens salvos em listas",Banco.d.itensLista.length],
    ["Conversões para Premium",conta("premium_ativado")]];
  t.append(voltar(voltarRota),el("div",{class:"wrap"},
    el("h1",{},"Métricas"),
    el("p",{class:"sub",style:"margin-bottom:18px"},"Os indicadores do §19 do PRD, medidos nesta sessão. Em produção iriam para o backend."),
    ...linhas.map(([r,n])=>el("div",{class:"opt"},el("span",{class:"t"},el("strong",{},r)),el("span",{class:"nota"},n))),
    el("div",{class:"fita"},"Retenção semanal e tempo de sessão dependem de telemetria no servidor — ficaram fora do protótipo.")));
};

/* ============================================================
   12. TEMA + BOOT
   ============================================================ */
function aplicarTema(){
  const tema=Sessao.user?.config?.tema||"sistema";
  if(tema==="sistema") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",tema);
}

(async function boot(){
  Banco.iniciar();
  await semearComunidade();
  Sessao.carregar();
  aplicarTema();
  if(Sessao.uid){ const u=Sessao.user; rota={nome:u.generosFav.length?"inicio":"onboarding",p:{}}; }
  else rota={nome:"abertura",p:{}};
  render();
})();
</script>
